services:
  - type: web
    name: launchpad-portal
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: launchpad-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
databases:
  - name: launchpad-db
    plan: basic-256mb
    region: singapore
