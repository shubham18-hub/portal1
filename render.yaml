services:
  # Backend Web Service
  - type: web
    name: klecba-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: klecba_feedback
      - key: CORS_ORIGINS
        value: https://klecba-frontend.onrender.com
      - key: ALLOWED_EMAIL_DOMAINS
        value: klecba.edu.in,kle.ac.in,klecba.edu
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://klecba-frontend.onrender.com
    healthCheckPath: /api/health

  # Frontend Web Service (Docker)
  - type: web
    name: klecba-frontend
    env: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    pullRequestPreviewsEnabled: true
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://klecba-backend.onrender.com
      - key: REACT_APP_GOOGLE_CLIENT_ID
        sync: false

